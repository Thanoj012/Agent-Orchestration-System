# One image, several roles: api, worker, ui - plus PostgreSQL, Redis and ChromaDB.
x-app: &app
  build: .
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://orchestrai:orchestrai@postgres:5432/orchestrai
    ANALYST_DATABASE_URL: postgresql+psycopg://analyst_ro:analyst_ro@postgres:5432/orchestrai
    REDIS_URL: redis://redis:6379/0
    CHROMA_HOST: chroma
    CHROMA_PORT: "8000"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    chroma: { condition: service_started }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orchestrai
      POSTGRES_PASSWORD: orchestrai
      POSTGRES_DB: orchestrai
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrai -d orchestrai"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  chroma:
    image: chromadb/chroma:latest    # tip: pin this to the same version as `chromadb` in requirements.txt
    environment:
      IS_PERSISTENT: "TRUE"
    ports: ["8001:8000"]
    volumes:
      - chroma_data:/data

  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2

  ui:
    <<: *app
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      <<: *app-env
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  pg_data:
  chroma_data:
