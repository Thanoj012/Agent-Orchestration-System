name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The unit tests are pure Python plus LangGraph: no databases, no API keys, no model downloads.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
